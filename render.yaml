services:
  - type: web
    name: threatsnap-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/db.json
      - key: JWT_SECRET
        generateValue: true
      - key: VT_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
