services:
  - type: web
    name: threatsnap-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: DB_PATH
        value: ../../db.json
      - key: JWT_SECRET
        generateValue: true
      - key: VT_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
